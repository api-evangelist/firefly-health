aid: firefly-health
name: Firefly Health
description: 'Firefly Health is a virtual-first primary care practice and clinically
  integrated health plan founded in 2016 and headquartered in Watertown, Massachusetts.
  Members get a dedicated care team - a primary care physician, nurse practitioner,
  health guide and behavioral health specialist - reachable by chat and video through
  the Firefly Health app, backed by the Firefly Nearby network for in-person, at-home
  and specialty care. Firefly sells an employer-sponsored alternative health plan
  alongside its virtual primary care service, and in 2025 became the first national
  primary care practice to earn NCQA Virtual Care Accreditation. Firefly publishes
  no public developer program, portal, documentation or specification: the member web
  and mobile apps are served by a private first-party API at api-prod.firefly.health
  under an /api/v2/ base path. Included Health signed an agreement to acquire Firefly
  Health in July 2026.'
